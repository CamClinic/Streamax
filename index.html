<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamax Diagnostic Guide</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background: #0f172a; 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 12px; 
            max-width: 550px; 
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
            border: 1px solid #334155;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 12px 12px 0 0;
        }
        h2 { 
            font-size: 1.35rem;
            line-height: 1.5;
            margin-bottom: 25px; 
            font-weight: 600;
        }
        button { 
            padding: 12px 24px; 
            margin-right: 12px; 
            margin-bottom: 12px;
            cursor: pointer; 
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        .btn-restart {
            background: #475569;
            color: #f8fafc;
        }
        .btn-restart:hover {
            background: #64748b;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <h2 id="question-text">Loading question...</h2>
        <div id="answers">
            <!-- Buttons are generated dynamically by JavaScript here -->
        </div>
    </div>

    <script>
        // Streamax step logic routing configuration
        const flow = {
            q1: {
                text: "What type of device setup is this?",
                yes: "q2_fresh", // Maps to Fresh Install selection
                no: "q2_old",    // Maps to Old Install selection
                labels: { yes: "Fresh Install", no: "Old Install" }
            },
            q2_fresh: {
                text: "Is the camera SIM active?",
                yes: "q3_installer",
                no: "res_success_dept"
            },
            res_success_dept: { 
                text: "Resolution: Connect with Success Department to activate the SIM.", 
                yes: null, 
                no: null 
            },
            q3_installer: {
                text: "Is the device installed by an installer?",
                yes: "q4_portal",
                no: "res_bill"
            },
            res_bill: { 
                text: "Resolution: Check with Bill for installation status.", 
                yes: null, 
                no: null 
            },
            q4_portal: {
                text: "Is the device added to the backend portal and on the customer portal?",
                yes: "q5_lights_fresh",
                no: "res_zenduit"
            },
            res_zenduit: { 
                text: "Resolution: Raise a ticket with Zenduit to add the device on backend and customer portal.", 
                yes: null, 
                no: null 
            },
            q5_lights_fresh: {
                text: "Is the device getting any light on the device?",
                yes: "q6_globe",
                no: "res_verify_connections"
            },
            res_verify_connections: { 
                text: "Resolution: Ask the customer to verify the connection.", 
                yes: null, 
                no: null 
            },
            q6_globe: {
                text: "Is there a globe light showing any light or not?",
                yes: "res_globe_yes",
                no: "res_globe_no"
            },
            res_globe_yes: { 
                text: "Resolution: Diagnostic completed. Globe light active.", 
                yes: null, 
                no: null 
            },
            res_globe_no: { 
                text: "Resolution: Diagnostic completed. Globe light inactive.", 
                yes: null, 
                no: null 
            },
            
            // Old Install branch path
            q2_old: {
                text: "Is the device getting any light on the device?",
                yes: "q6_globe",
                no: "res_verify_connections"
            }
        };

        let currentStep = 'q1';

        function render() {
            const currentObj = flow[currentStep];
            document.getElementById('question-text').innerText = currentObj.text;
            
            const answersDiv = document.getElementById('answers');
            
            if (currentObj.yes === null) {
                // Leaf resolution end of decision node path reached
                answersDiv.innerHTML = `<button class="btn-restart" onclick="resetFlow()">Start Over</button>`;
            } else {
                // Fetch dynamic text string overrides for selection buttons if present
                const textYes = (currentObj.labels && currentObj.labels.yes) ? currentObj.labels.yes : "Yes";
                const textNo = (currentObj.labels && currentObj.labels.no) ? currentObj.labels.no : "No";
                
                answersDiv.innerHTML = `
                    <button onclick="handleAnswer('yes')">${textYes}</button>
                    <button onclick="handleAnswer('no')">${textNo}</button>
                `;
            }
        }

        function handleAnswer(choice) {
            const currentObj = flow[currentStep];
            currentStep = choice === 'yes' ? currentObj.yes : currentObj.no;
            render();
        }

        function resetFlow() {
            currentStep = 'q1';
            render();
        }

        // Initialize display configuration state
        render();
    </script>
</body>
</html>
