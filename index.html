<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamax Diagnostic Guide</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 12px 12px 0 0;
        }

        h2 {
            font-size: 1.35rem;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 14px 24px;
            cursor: pointer;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
            text-align: left;
            width: 100%;
        }

        button:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-restart {
            background: #475569;
            color: #f8fafc;
            text-align: center;
            flex: 1;
        }

        .btn-restart:hover {
            background: #64748b;
        }

        .btn-back {
            background: #334155;
            color: #94a3b8;
            text-align: center;
            border: 1px solid #475569;
            flex: 1;
        }

        .btn-back:hover {
            background: #475569;
            color: #f8fafc;
        }

        .resolution-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid #38bdf8;
            padding: 15px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <h2 id="question-text">Loading diagnostic steps...</h2>
        <div id="answers" class="btn-container"></div>
        <div id="navigation-controls" class="nav-controls"></div>
    </div>

    <script>
        /*
         * SOURCE OF TRUTH:
         * "Mohit Streamax(2).drawio"
         *
         * The flow below follows the actual node-to-node connections
         * in the Draw.io diagram. No additional branches are invented.
         */
        const flow = {
            start: {
                text: "Streamax Device issue",
                choices: [
                    { text: "Camera Quality ( Resolution & Audio Issue )", next: "camera_quality" },
                    { text: "Device Offline", next: "device_offline" },
                    { text: "Rules Not working", next: "rules_not_working" },
                    { text: "Recording Issue", next: "recording_issue" },
                    { text: "Aux camera not showing", next: "aux_camera" }
                ]
            },

            camera_quality: {
                text: "Camera Quality ( Resolution & Audio Issue )",
                choices: null
            },

            rules_not_working: {
                text: "Rules Not working",
                choices: null
            },

            recording_issue: {
                text: "Recording Issue",
                choices: [
                    { text: "Not Recording", next: "not_recording" },
                    { text: "intermittent Recording", next: "intermittent_recording" }
                ]
            },

            not_recording: {
                text: "Not Recording",
                choices: null
            },

            intermittent_recording: {
                text: "intermittent Recording",
                choices: null
            },

            aux_camera: {
                text: "Aux camera not showing",
                choices: null
            },

            device_offline: {
                text: "Does the device shows any Light ?",
                choices: [
                    { text: "Yes", next: "globe_light" },
                    { text: "No", next: "installation_type" }
                ]
            },

            installation_type: {
                text: "Select installation type",
                choices: [
                    { text: "Trackcam Installer installation", next: "trackcam_installer" },
                    { text: "Customer Installer Installation", next: "customer_installer" }
                ]
            },

            customer_installer: {
                text: "Ask for current Installation Pic or video ?",
                choices: [
                    { text: "Installation Looks Good ?", next: "installation_looks_good" }
                ]
            },

            trackcam_installer: {
                text: "Check Zoho Creator App",
                choices: [
                    { text: "Any Recent Changes in Vehicles ?", next: "recent_vehicle_changes" }
                ]
            },

            installation_looks_good: {
                text: "Installation Looks Good ?",
                choices: [
                    { text: "Yes", next: "installation_good_yes" },
                    { text: "No", next: "installation_good_no" }
                ]
            },

            installation_good_yes: {
                text: "Yes",
                choices: null
            },

            installation_good_no: {
                text: "No",
                choices: [
                    { text: "Go back to Installation Looks Good ?", next: "installation_looks_good" },
                    { text: "Schedule Customer Installer Visit", next: "schedule_customer_installer_visit" }
                ]
            },

            schedule_customer_installer_visit: {
                text: "Schedule Customer Installer Visit",
                choices: null
            },

            recent_vehicle_changes: {
                text: "Any Recent Changes in Vehicles ?",
                choices: [
                    { text: "is Geotab Installed ?", next: "geotab_installed" }
                ]
            },

            geotab_installed: {
                text: "is Geotab Installed ?",
                choices: [
                    { text: "Yes", next: "battery_voltage_check" },
                    { text: "No", next: "disconnect_wires" }
                ]
            },

            battery_voltage_check: {
                text: "Can we verify the Battery voltage on Geotab portal ?",
                choices: [
                    { text: "Does it Shows any battery drop when the vehicle gets ignition On/Off ?", next: "battery_drop" }
                ]
            },

            battery_drop: {
                text: "Does it Shows any battery drop when the vehicle gets ignition On/Off ?",
                choices: [
                    { text: "No", next: "schedule_installer_battery" },
                    { text: "Yes", next: "install_type" }
                ]
            },

            schedule_installer_battery: {
                text: "Schedule Installer Visit",
                choices: null
            },

            install_type: {
                text: "Is this Hardwire Install or T harness Installation ?",
                choices: [
                    { text: "T Harness", next: "disconnect_other_device" },
                    { text: "Hardwire Install ?", next: "hardwire_resolution" }
                ]
            },

            hardwire_resolution: {
                text: "Schedule Installer Visit for Device swap or wire check",
                choices: null
            },

            disconnect_other_device: {
                text: "Can client disconnect other device a part from Camera ?",
                choices: [
                    { text: "Yes", next: "disconnect_other_device_yes" },
                    { text: "No", next: "disconnect_other_device_no" }
                ]
            },

            disconnect_other_device_yes: {
                text: "Did it worked?",
                choices: [
                    { text: "Yes", next: "change_harness" },
                    { text: "No", next: "connect_direct_obd" }
                ]
            },

            disconnect_other_device_no: {
                text: "No",
                choices: null
            },

            change_harness: {
                text: "Change Harness / replace power cable of camera",
                choices: null
            },

            connect_direct_obd: {
                text: "Connect the camera directly into OBD port",
                choices: [
                    { text: "Did it worked ?", next: "obd_result" }
                ]
            },

            obd_result: {
                text: "Did it worked ?",
                choices: [
                    { text: "Yes", next: "change_harness_after_obd" },
                    { text: "No", next: "schedule_installer" }
                ]
            },

            change_harness_after_obd: {
                text: "Change Harness / replace power cable of camera",
                choices: null
            },

            schedule_installer: {
                text: "Schedule Installer",
                choices: null
            },

            disconnect_wires: {
                text: "Can Customer Disconnect and connect back the wires one by one",
                choices: [
                    { text: "Yes", next: "wire_reconnection_result" },
                    { text: "No", next: "schedule_installer_visit" }
                ]
            },

            wire_reconnection_result: {
                text: "After connecting wire is the device working ?",
                choices: [
                    { text: "Yes", next: "issue_resolved_wire" },
                    { text: "No", next: "schedule_installer_visit" }
                ]
            },

            issue_resolved_wire: {
                text: "issue resolved",
                choices: null
            },

            schedule_installer_visit: {
                text: "Schedule Installer Visit",
                choices: null
            },

            globe_light: {
                text: "Does it show Globe Light ?",
                choices: [
                    { text: "Yes", next: "sim_active" },
                    { text: "No", next: "go_back_correct_option" }
                ]
            },

            go_back_correct_option: {
                text: "Please Go back and select the correct option",
                choices: null
            },

            sim_active: {
                text: "Is the SIM active",
                choices: [
                    { text: "Yes", next: "swap_sim" },
                    { text: "No", next: "success_manager_escalation" }
                ]
            },

            success_manager_escalation: {
                text: "Escalate/Transfer ticket with Success Manager",
                choices: null
            },

            swap_sim: {
                text: "Can Client swap with an active SIM ?",
                choices: [
                    { text: "Yes", next: "swap_result" },
                    { text: "No", next: "veyse_access" }
                ]
            },

            swap_result: {
                text: "After Swapping working Did it worked ?",
                choices: [
                    { text: "Yes", next: "sim_swap_resolved" },
                    { text: "No", next: "sim_swap_no_resolution" }
                ]
            },

            sim_swap_resolved: {
                text: "Issue resolved",
                choices: null
            },

            sim_swap_no_resolution: {
                text: "No",
                choices: null
            },

            veyse_access: {
                text: "Can client access the Veyse app ?",
                choices: [
                    { text: "Yes", next: "veyse_login" },
                    { text: "No", next: "portal_check" }
                ]
            },

            portal_check: {
                text: "Is the device added on portal ?",
                choices: [
                    { text: "Yes", next: "installer_visit_device" },
                    { text: "No", next: "zenduit_add_device" }
                ]
            },

            installer_visit_device: {
                text: "Raise Installer Visit request to check the device",
                choices: null
            },

            zenduit_add_device: {
                text: "Raise Ticket With Zenduit to add the device on backend and front end",
                choices: [
                    { text: "Did the issue resolved after adding the device ?", next: "issue_after_adding" }
                ]
            },

            issue_after_adding: {
                text: "Did the issue resolved after adding the device ?",
                choices: [
                    { text: "Yes", next: "issue_resolved_after_adding" },
                    { text: "No", next: "schedule_installer_after_adding" }
                ]
            },

            issue_resolved_after_adding: {
                text: "Issue resolved after adding the device",
                choices: null
            },

            schedule_installer_after_adding: {
                text: "Schedule Installer Visit",
                choices: null
            },

            veyse_login: {
                text: "Was the client able to login into Veyse app ?",
                choices: [
                    { text: "Yes", next: "sim_status" },
                    { text: "No", next: "camera_wifi" }
                ]
            },

            camera_wifi: {
                text: "Is the camera wifi Connected to device ?",
                choices: [
                    { text: "Yes", next: "sim_status" },
                    { text: "No", next: "panic_button" }
                ]
            },

            panic_button: {
                text: "Try to press the panic button 2-3 times to enable Wifi",
                choices: [
                    { text: "Yes", next: "camera_wifi_after_panic" },
                    { text: "No", next: "installer_visit_device" }
                ]
            },

            camera_wifi_after_panic: {
                text: "Is the camera wifi Connected to device ?",
                choices: [
                    { text: "Yes", next: "camera_wifi_yes" },
                    { text: "No", next: "panic_button" }
                ]
            },

            camera_wifi_yes: {
                text: "Is the camera wifi Connected to device ?",
                choices: [
                    { text: "Yes", next: "sim_status" },
                    { text: "No", next: "panic_button" }
                ]
            },

            sim_status: {
                text: "What is SIM status on Veyese app ? (General >> Device Module)",
                choices: [
                    { text: "Not Existed", next: "sim_not_existed" },
                    { text: "Existed", next: "sim_existed" }
                ]
            },

            sim_not_existed: {
                text: "Raise Installer Visit",
                choices: null
            },

            sim_existed: {
                text: "What is Signal Strength showing",
                choices: [
                    { text: "Showing 3+ Bars", next: "server_status" },
                    { text: "Showing No Signal Bars", next: "communication_module" }
                ]
            },

            server_status: {
                text: "What is the Server Status ?",
                choices: [
                    { text: "Disconnected", next: "server_settings" },
                    { text: "Connected", next: "server_connected_resolution" }
                ]
            },

            server_settings: {
                text: "Navigate to below path to update the Server Settings. Preference >> basic Setup >> Network >> Server Settings Check Server 1 should be enable only with correct settings.",
                choices: [
                    { text: "Did the device working and shows connected ?", next: "server_settings_result" }
                ]
            },

            server_settings_result: {
                text: "Did the device working and shows connected ?",
                choices: [
                    { text: "Yes", next: "issue_resolved_server" },
                    { text: "No", next: "support_screenshot" }
                ]
            },

            issue_resolved_server: {
                text: "Issue Resolved",
                choices: null
            },

            server_connected_resolution: {
                text: "Take Screenshot of below things and raise ticket with Zenduit / also Schedule Installer visit. General >> Device Module. Preference >> basic Setup >> Network >> Server Settings Preference >> basic Setup >> Network >> Communication Module",
                choices: null
            },

            communication_module: {
                text: "Navigate to Preference >> Basic Setup >> Network >> Communication Module",
                choices: [
                    { text: "Does it shows Correct APN Settings ?", next: "apn_check" }
                ]
            },

            apn_check: {
                text: "Does it shows Correct APN Settings ?",
                choices: [
                    { text: "Yes", next: "support_screenshot" },
                    { text: "No", next: "select_correct_apn" }
                ]
            },

            select_correct_apn: {
                text: "Select the Correct APN",
                choices: [
                    { text: "After the APN update, Did the device working fine ?", next: "apn_result" }
                ]
            },

            apn_result: {
                text: "After the APN update, Did the device working fine ?",
                choices: [
                    { text: "Yes", next: "issue_resolved_apn" },
                    { text: "No", next: "support_screenshot" }
                ]
            },

            issue_resolved_apn: {
                text: "Issue resolved",
                choices: null
            },

            support_screenshot: {
                text: "Take Screenshot of below things and raise ticket with Zenduit / also Schedule Installer visit. General >> Device Module. Preference >> basic Setup >> Network >> Server Settings Preference >> basic Setup >> Network >> Communication Module",
                choices: null
            }
        };

        let currentStep = "start";
        let historyStack = [];

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function render() {
            const currentObj = flow[currentStep];
            const displayEl = document.getElementById("question-text");
            const answersDiv = document.getElementById("answers");
            const navDiv = document.getElementById("navigation-controls");

            if (!currentObj) {
                displayEl.innerHTML = '<div class="resolution-box">Invalid flow node.</div>';
                answersDiv.innerHTML = "";
                navDiv.innerHTML = '<button class="btn-restart" onclick="resetFlow()">Restart Process</button>';
                return;
            }

            if (currentObj.choices === null) {
                displayEl.innerHTML =
                    `<div class="resolution-box">${escapeHtml(currentObj.text)}</div>`;
                answersDiv.innerHTML = "";
                navDiv.innerHTML = `
                    <button class="btn-back" onclick="goBack()">← Go Back</button>
                    <button class="btn-restart" onclick="resetFlow()">Restart Process</button>
                `;
                return;
            }

            displayEl.innerText = currentObj.text;

            let htmlContent = "";
            currentObj.choices.forEach((item, index) => {
                htmlContent +=
                    `<button onclick="handleSelection(${index})">${escapeHtml(item.text)}</button>`;
            });

            answersDiv.innerHTML = htmlContent;

            if (historyStack.length > 0) {
                navDiv.innerHTML =
                    `<button class="btn-back" onclick="goBack()">← Go Back</button>`;
            } else {
                navDiv.innerHTML = "";
            }
        }

        function handleSelection(index) {
            const currentObj = flow[currentStep];

            if (!currentObj || !currentObj.choices || !currentObj.choices[index]) {
                return;
            }

            const nextStep = currentObj.choices[index].next;

            if (!flow[nextStep]) {
                console.error(`Missing flow node: ${nextStep}`);
                return;
            }

            historyStack.push(currentStep);
            currentStep = nextStep;
            render();
        }

        function goBack() {
            if (historyStack.length > 0) {
                currentStep = historyStack.pop();
                render();
            }
        }

        function resetFlow() {
            currentStep = "start";
            historyStack = [];
            render();
        }

        render();
    </script>
</body>
</html>
